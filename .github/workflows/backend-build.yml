name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - "app/backend/**"
      - ".github/workflows/backend-build.yml"

  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write
  issues: write

jobs:
  build-and-publish:
    name: Build and publish backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image metadata
        shell: bash
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/aspecta-backend" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        run: |
          docker build \
            --tag "${IMAGE}:${IMAGE_TAG}" \
            ./app/backend

      - name: Push backend image
        run: |
          docker push "${IMAGE}:${IMAGE_TAG}"

      - name: Update backend image tag in Helm
        uses: mikefarah/yq@v4
        with:
          cmd: yq -i '.backend.image.tag = strenv(IMAGE_TAG)' helm/aspecta/values.yaml
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}

      - name: Install Helm
        uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3

      - name: Validate and package updated Helm chart
        shell: bash
        run: |
          helm lint helm/aspecta
          helm template aspecta helm/aspecta --namespace aspecta > /dev/null
          CHART_VERSION=$(helm show chart helm/aspecta | awk '/^version:/ {print $2}')
          helm package helm/aspecta \
            --version "${CHART_VERSION}-backend.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            --destination "${RUNNER_TEMP}/helm-package"

      - name: Upload Helm package
        uses: actions/upload-artifact@v4
        with:
          name: aspecta-backend-chart
          path: ${{ runner.temp }}/helm-package/*.tgz

      - name: Create Helm update Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

          branch: ci/backend-${{ env.IMAGE_TAG }}
          delete-branch: true

          commit-message: "chore: update backend image to ${{ env.IMAGE_TAG }}"
          title: "chore: update backend image to ${{ env.IMAGE_TAG }}"

          body: |
            ## Backend image update

            Automated Helm update created by the backend CI pipeline.

            **Container image**

            `${{ env.IMAGE }}:${{ env.IMAGE_TAG }}`

            **Source commit**

            `${{ github.sha }}`

            The Helm chart updates only `backend.image.tag`.

      - name: Add build information to Pull Request
        if: steps.cpr.outputs.pull-request-number
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ steps.cpr.outputs.pull-request-number }}'),
              body: [
                '## Backend build completed',
                '',
                '**Image**',
                '`${{ env.IMAGE }}:${{ env.IMAGE_TAG }}`',
                '',
                '**GitHub Actions build**',
                'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}',
                '',
                '**Source commit**',
                '`${{ github.sha }}`'
              ].join('\n')
            })
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: {{ .Values.namespace }}
  labels:
    app: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}

          ports:
            - containerPort: {{ .Values.backend.service.targetPort }}

          env:
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: aspecta-config
                  key: environment

            - name: APP_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: aspecta-config
                  key: appMessage

            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: aspecta-secret
                  key: apiKey

          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}

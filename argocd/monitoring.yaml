apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.1.1
    helm:
      releaseName: monitoring
      valuesObject:
        # Minimal local stack: Prometheus, Alertmanager and Kubernetes exporters.
        grafana:
          enabled: false
        # These control-plane endpoints are not exposed for scraping in minikube.
        kubeEtcd:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
        prometheus:
          prometheusSpec:
            retention: 24h
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 768Mi
        alertmanager:
          # Alerts are visible in the UI. Add an external receiver separately.
          config:
            global:
              resolve_timeout: 5m
            route:
              receiver: local
              routes: []
              group_by: [alertname, namespace]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
            receivers:
              - name: local
        additionalPrometheusRulesMap:
          aspecta:
            groups:
              - name: aspecta
                rules:
                  - alert: AspectaDeploymentUnavailable
                    expr: kube_deployment_status_replicas_available{namespace="aspecta",deployment=~"backend|frontend"} < 1
                    for: 1m
                    labels:
                      severity: critical
                    annotations:
                      summary: 'Deployment {{ $labels.deployment }} has no available replicas'
                  - alert: AspectaReplicasMismatch
                    expr: kube_deployment_spec_replicas{namespace="aspecta",deployment=~"backend|frontend"} > kube_deployment_status_replicas_available{namespace="aspecta",deployment=~"backend|frontend"}
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'Deployment {{ $labels.deployment }} has fewer available replicas than requested'
                  - alert: AspectaContainerRestarts
                    expr: increase(kube_pod_container_status_restarts_total{namespace="aspecta"}[10m]) > 3
                    for: 2m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'Container {{ $labels.container }} in pod {{ $labels.pod }} keeps restarting'
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
